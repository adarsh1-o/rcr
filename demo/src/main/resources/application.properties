spring.application.name=demo

# MySQL configuration (default)
spring.datasource.url=jdbc:mysql://localhost:3306/demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
app.jwt.secret=ChangeThisSecretKeyForJwtSigning_ChangeThisSecretKeyForJwtSigning
app.jwt.expirationMillis=3600000

# For security/JWT endpoints
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# H2 Console (disabled by default, enable with -Dspring.profiles.active=h2)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Assignment resource uploads are stored privately outside the application web root.
app.assignment-files.storage-dir=${ASSIGNMENT_RESOURCE_STORAGE_DIR:${user.home}/.remote-learning-platform/assignment-resources}
app.assignment-files.max-file-size=${ASSIGNMENT_RESOURCE_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-file-size=${app.assignment-files.max-file-size}
spring.servlet.multipart.max-request-size=11MB

# RCR Assistant (the API key is read only by the backend process)
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
openai.web-search.enabled=${OPENAI_WEB_SEARCH_ENABLED:true}
